name: Build Fabric Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          unzip -o aaaaa-template-26.3.zip
          rm -f aaaaa-template-26.3.zip

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          MOD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$MOD_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: "**/build/libs/*.jar"
