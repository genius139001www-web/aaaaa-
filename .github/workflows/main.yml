name: Build Fabric Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          unzip -o aaaaa-template-26.3.zip
          rm -f aaaaa-template-26.3.zip
          if [ -d "aaaaa-template-26.3" ]; then mv aaaaa-template-26.3/* . && mv aaaaa-template-26.3/.* . 2>/dev/null || true; fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: build/libs/*.jar
